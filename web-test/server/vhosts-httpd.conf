
<VirtualHost *:80>
    ServerName js-blocker.com
    ServerAlias sub1.js-blocker.com
    ServerAlias sub2.sub1.js-blocker.com
    ServerAlias sub3.sub2.sub1.js-blocker.com
    ServerAlias www.js-blocker.com
    ServerAlias js-blocker
    DirectoryIndex index.php
    DocumentRoot "/Volumes/dev/xcode/js_blocker/web-test/webroot"
</VirtualHost>

<IfModule ssl_module>
  <VirtualHost *:443>
      ServerName js-blocker.com
      ServerAlias www.js-blocker.com
      ServerAlias sub1.js-blocker.com
      ServerAlias sub2.sub1.js-blocker.com
      ServerAlias sub3.sub2.sub1.js-blocker.com
      ServerAlias js-blocker.net
      ServerAlias js-blocker
      DirectoryIndex index.php
      DocumentRoot "/Volumes/dev/xcode/js_blocker/web-test/webroot"
      SSLEngine on
      SSLCertificateFile    "/Volumes/dev/web/sert/domain.crt"
      SSLCertificateKeyFile "/Volumes/dev/web/sert/domain.private.key"
  </VirtualHost>
</IfModule>
